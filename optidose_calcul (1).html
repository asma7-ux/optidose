<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OptiDose — calcul de dose</title>
<style>
  :root{
    --jaune-vert:#C3D02E;
    --vert-fonce:#1F5237;
    --vert-clair:#E4EFE4;
    --ocre:#C8860D;
    --bleu-mildiou:#1C6E8C;
    --encre:#25281F;
    --encre-douce:#63665C;
    --trait:#D8D5D0;
    --blanc:#FFFFFF;
    --fond:#F2EFED;
    --alerte:#9A3B12;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:0;background:var(--fond);color:var(--encre);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.45;
  }

  .bandeau{
    background:var(--jaune-vert);padding:14px 28px;
    display:flex;align-items:center;gap:16px;
  }
  .logo{width:64px;height:44px;flex-shrink:0}
  .marque{font-size:26px;font-weight:600;letter-spacing:-.01em}
  .date{margin-left:auto;font-size:14px;color:#4A5220}

  .page{padding:22px 28px 30px}

  .carte{
    background:var(--blanc);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .carte-titre{
    background:var(--jaune-vert);padding:14px 26px;
    font-size:19px;font-weight:600;color:#2C3410;
  }
  .carte-corps{padding:24px 26px}

  .rangee-mesures{
    display:grid;grid-template-columns:repeat(3,minmax(140px,1fr)) auto;
    gap:20px;align-items:end;margin-bottom:22px;
  }
  .rangee-choix{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px 28px;margin-bottom:22px;
  }

  label,.etiquette{display:block;font-size:14px;font-weight:500;color:var(--encre);margin-bottom:7px}
  input[type=number],select{
    width:100%;padding:10px 13px;font-size:16px;font-family:inherit;color:var(--encre);
    background:var(--blanc);border:1px solid var(--trait);border-radius:9px;
  }
  input[type=number]:focus,select:focus{outline:2px solid var(--vert-fonce);outline-offset:-1px}
  input.invalide{border-color:var(--alerte);background:#FDF4F0}

  .trv-encadre{
    background:var(--vert-fonce);border-radius:11px;padding:11px 26px;
    text-align:center;min-width:150px;color:var(--blanc);
  }
  .trv-mot{font-size:13px;font-weight:600;color:var(--jaune-vert);letter-spacing:.06em}
  .trv-chiffre{font-size:31px;font-weight:600;line-height:1.15}
  .trv-unite{font-size:12px;opacity:.85}

  .segment{display:flex}
  .segment button{
    flex:1;padding:10px 6px;font:inherit;font-size:15px;cursor:pointer;
    background:var(--blanc);color:var(--encre);border:1px solid var(--trait);
    border-right-width:0;transition:background .12s,color .12s;
  }
  .segment button:first-child{border-radius:9px 0 0 9px}
  .segment button:last-child{border-right-width:1px;border-radius:0 9px 9px 0}
  .segment button[aria-pressed=true]{background:var(--ocre);color:var(--blanc);border-color:var(--ocre);font-weight:500}
  .segment button:focus-visible{outline:2px solid var(--encre);outline-offset:1px;z-index:1}

  .zone-doses{background:var(--vert-clair);border-radius:11px;padding:18px}
  .doses{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .dose{background:var(--blanc);border-radius:9px;padding:14px 18px 16px;text-align:center;border-top:4px solid var(--trait)}
  .dose.mildiou{border-top-color:var(--bleu-mildiou)}
  .dose.oidium{border-top-color:var(--ocre)}
  .dose-titre{font-size:13.5px;font-weight:600;letter-spacing:.05em;margin-bottom:4px}
  .dose.mildiou .dose-titre{color:var(--bleu-mildiou)}
  .dose.oidium .dose-titre{color:var(--ocre)}
  .dose-chiffre{font-size:34px;font-weight:600;line-height:1.1}
  .dose.mildiou .dose-chiffre{color:var(--bleu-mildiou)}
  .dose.oidium .dose-chiffre{color:var(--ocre)}
  .dose-detail{font-size:12.5px;color:var(--encre-douce);margin-top:5px}

  .plage{font-size:13px;color:var(--encre-douce);margin:0 0 14px}
  .message{
    background:#FDF4F0;border-left:4px solid var(--alerte);border-radius:0;
    padding:13px 16px;color:var(--alerte);font-size:14px;
  }
  .message strong{display:block;margin-bottom:3px;font-weight:600}
  .attente{color:var(--encre-douce);font-size:14px;font-style:italic;margin:0}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
  @media (max-width:640px){
    .rangee-mesures{grid-template-columns:1fr 1fr}
    .trv-encadre{grid-column:1/-1}
    .bandeau{padding:12px 16px}.page{padding:16px}
  }
</style>
</head>
<body>

<header class="bandeau">
  <svg class="logo" viewBox="0 0 64 44" role="img" aria-label="Institut Français de la Vigne et du Vin">
    <rect x="0" y="0" width="64" height="44" rx="4" fill="#15205C"></rect>
    <circle cx="11" cy="14" r="2.6" fill="#C3D02E"></circle>
    <circle cx="18" cy="14" r="2.6" fill="#C3D02E"></circle>
    <circle cx="25" cy="14" r="2.6" fill="#C3D02E"></circle>
    <circle cx="14.5" cy="20" r="2.6" fill="#C3D02E"></circle>
    <circle cx="21.5" cy="20" r="2.6" fill="#C3D02E"></circle>
    <circle cx="18" cy="26" r="2.6" fill="#C3D02E"></circle>
    <text x="36" y="28" font-family="Avenir Next, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">IFV</text>
  </svg>
  <span class="marque">OptiDose</span>
  <span class="date" id="date-jour"></span>
</header>

<div class="page">
<div class="carte">
  <div class="carte-titre">Calculateur de dose</div>
  <div class="carte-corps">

    <div class="rangee-mesures">
      <div>
        <label for="h">Hauteur de feuillage (m)</label>
        <input type="number" id="h" step="0.01" min="0" placeholder="1,20" inputmode="decimal">
      </div>
      <div>
        <label for="l">Largeur de feuillage (m)</label>
        <input type="number" id="l" step="0.01" min="0" placeholder="0,45" inputmode="decimal">
      </div>
      <div>
        <label for="e">Espacement inter-rang (m)</label>
        <input type="number" id="e" step="0.01" min="0" placeholder="2,00" inputmode="decimal">
      </div>
      <div class="trv-encadre">
        <div class="trv-mot">TRV</div>
        <div class="trv-chiffre" id="trv-valeur">—</div>
        <div class="trv-unite">m³ / ha</div>
      </div>
    </div>

    <div class="rangee-choix">
      <div>
        <label for="stade">Stade phénologique</label>
        <select id="stade"></select>
      </div>
      <div>
        <span class="etiquette" id="lbl-mildiou">Risque mildiou estimé</span>
        <div class="segment" id="seg-mildiou" role="group" aria-labelledby="lbl-mildiou"></div>
      </div>
      <div>
        <span class="etiquette" id="lbl-oidium">Risque oïdium estimé</span>
        <div class="segment" id="seg-oidium" role="group" aria-labelledby="lbl-oidium"></div>
      </div>
    </div>

    <div aria-live="polite">
      <p class="attente" id="attente">Renseignez la hauteur, la largeur et l'espacement pour obtenir le TRV et les doses.</p>

      <div id="bloc-erreur" hidden>
        <div class="message">
          <strong id="erreur-titre"></strong>
          <span id="erreur-texte"></span>
        </div>
      </div>

      <div id="bloc-resultat" hidden>
        <p class="plage" id="trv-legende"></p>
        <div class="zone-doses">
          <div class="doses">
            <div class="dose mildiou">
              <div class="dose-titre">DOSE MILDIOU</div>
              <div class="dose-chiffre" id="dose-mildiou"></div>
              <div class="dose-detail" id="detail-mildiou"></div>
            </div>
            <div class="dose oidium">
              <div class="dose-titre">DOSE OÏDIUM</div>
              <div class="dose-chiffre" id="dose-oidium"></div>
              <div class="dose-detail" id="detail-oidium"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</div>

const LIMITES = { h:[0.05, 3.5], l:[0.05, 2.5], e:[0.05, 5.0] };
const NIVEAUX = ["faible","moyen","fort"];
const etat = { mildiou:"faible", oidium:"faible" };
const $ = id => document.getElementById(id);

$("date-jour").textContent = new Date().toLocaleDateString("fr-FR",
  { weekday:"long", day:"numeric", month:"long", year:"numeric" });

const selStade = $("stade");
REGLES.stades.forEach(([code, libelle]) => {
  const o = document.createElement("option");
  o.value = code; o.textContent = libelle;
  selStade.appendChild(o);
});

function construireSegment(conteneur, maladie){
  NIVEAUX.forEach(niveau => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = niveau.charAt(0).toUpperCase() + niveau.slice(1);
    b.setAttribute("aria-pressed", String(etat[maladie] === niveau));
    b.addEventListener("click", () => {
      etat[maladie] = niveau;
      [...conteneur.children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      recalculer();
    });
    conteneur.appendChild(b);
  });
}
construireSegment($("seg-mildiou"), "mildiou");
construireSegment($("seg-oidium"), "oidium");

function trancheDe(trv){
  for (let i = 0; i < REGLES.bornes.length; i++){
    const [min, max] = REGLES.bornes[i];
    if (trv >= min && trv < max) return i;
  }
  return -1;
}

function doseDe(stade, maladie, risque, index){
  const parStade = REGLES.doses[String(stade)];
  if (!parStade || !parStade[maladie] || !parStade[maladie][risque]) return null;
  const v = parStade[maladie][risque][index];
  return (v === undefined) ? null : v;
}

function formater(n){ return n.toLocaleString("fr-FR", { maximumFractionDigits:0 }); }

function recalculer(){
  const champs = { h:$("h"), l:$("l"), e:$("e") };
  const vals = {};
  let vide = false, horsDomaine = null;

  for (const cle of ["h","l","e"]){
    const brut = champs[cle].value.trim();
    champs[cle].classList.remove("invalide");
    if (brut === ""){ vide = true; continue; }
    const v = parseFloat(brut.replace(",", "."));
    if (!isFinite(v)){ vide = true; continue; }
    vals[cle] = v;
    const [bas, haut] = LIMITES[cle];
    if (v < bas || v > haut){ horsDomaine = cle; champs[cle].classList.add("invalide"); }
  }

  const afficher = (mode) => {
    $("attente").hidden = mode !== "attente";
    $("bloc-erreur").hidden = mode !== "erreur";
    $("bloc-resultat").hidden = mode !== "ok";
    if (mode !== "ok") $("trv-valeur").textContent = "—";
  };

  if (vide){ afficher("attente"); return; }

  if (horsDomaine !== null){
    const noms = { h:"La hauteur de feuillage", l:"La largeur de feuillage", e:"L'espacement inter-rang" };
    const [bas, haut] = LIMITES[horsDomaine];
    $("erreur-titre").textContent = "Valeur hors du domaine admissible";
    $("erreur-texte").textContent =
      noms[horsDomaine] + " doit être comprise entre " +
      bas.toLocaleString("fr-FR") + " m et " + haut.toLocaleString("fr-FR") +
      " m. Vérifiez la mesure saisie.";
    afficher("erreur");
    return;
  }

  const trv = 10000 * vals.h * vals.l / vals.e;
  const index = trancheDe(trv);

  if (index === -1){
    $("erreur-titre").textContent = "TRV hors des plages définies";
    $("erreur-texte").textContent =
      "Le TRV calculé (" + formater(trv) + " m³/ha) ne correspond à aucune plage du référentiel. " +
      "Vérifiez les trois mesures saisies.";
    afficher("erreur");
    return;
  }

  const stade = parseInt(selStade.value, 10);
  const [bMin, bMax] = REGLES.bornes[index];
  const borneHaute = (bMax >= 9999999) ? "et plus" : "à " + formater(bMax);

  $("trv-valeur").textContent = formater(trv);
  $("trv-legende").textContent = "Plage de référence : " + formater(bMin) + " " + borneHaute + " m³/ha";

  for (const maladie of ["mildiou","oidium"]){
    const d = doseDe(stade, maladie, etat[maladie], index);
    $("dose-" + maladie).textContent = (d === null) ? "—" : d + " %";
    $("detail-" + maladie).textContent = (d === null)
      ? "Aucune règle pour cette combinaison"
      : "Risque " + etat[maladie] + " · " + selStade.options[selStade.selectedIndex].text;
  }
  afficher("ok");
}

["h","l","e"].forEach(id => $(id).addEventListener("input", recalculer));
selStade.addEventListener("change", recalculer);
recalculer();
</script>
