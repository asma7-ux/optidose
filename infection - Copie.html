<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infection théorique par hypothèse</title>
<!--
  Graphique « couloirs par hypothèse » pour la plateforme COMPILE (ArcGIS Experience Builder, widget Intégrer).
  Lit directement la couche ArcGIS (statistiques journalières calculées par le serveur).

  Paramètres d'adresse :
    zone=16 | 33            couche ROSSI prédéfinie (Charentes / Nouvelle-Aquitaine)
    couche=<URL>            URL d'une couche …/FeatureServer/0 (remplace « zone »)
    commune=<COMMUNE>       moyenne des points d'une commune
    point=<NOM_PS>          un seul point
    stat=avg | max          statistique journalière entre les points (défaut : avg = moyenne)
    debut=AAAA-MM-JJ, fin=AAAA-MM-JJ   période affichée (défaut : toute la période disponible)
    titre=<texte>           texte affiché en tête
    champs=ZIN_H1,ZIN_H2,ZIN_H3        champs à représenter (un couloir par champ)
    noms=Hypothèse 1,Hypothèse 2,Hypothèse 3
    seuils=1.5,4.25,8.3     seuils des classes de risque
    demo=1                  données simulées (test sans connexion)
-->
<style>
  :root {
    --fond: #faf7f5;
    --texte: #1f1e1c;
    --texte-2: #52514e;
    --texte-3: #898781;
    --zero: #d3d1c7;
    --police: "Avenir Next", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--police); background: var(--fond); color: var(--texte); }
  main { padding: 12px 16px 16px; }
  .entete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .meta { font-size: 12px; color: var(--texte-3); }
  .lecture { font-size: 13px; min-height: 20px; margin: 8px 0 4px; color: var(--texte); }
  .lecture strong { font-weight: 600; }
  .couloir { position: relative; height: var(--h, 140px); }
  .couloir.dernier { height: calc(var(--h, 140px) + 26px); }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--texte-2); }
  .legende span { display: inline-flex; align-items: center; gap: 5px; }
  .pastille { width: 11px; height: 11px; border-radius: 2px; border: 0.5px solid rgba(0,0,0,.12); display: inline-block; }
  .hachure { background: repeating-linear-gradient(45deg, #888780 0 1px, transparent 1px 4px); }
  .message { padding: 16px; border-radius: 8px; background: #fff; border: 1px solid #e3e0d8; font-size: 14px; color: var(--texte-2); }
  .message.erreur { border-color: #e6b3b0; background: #fdf3f2; color: #8a2a22; }
  .note { font-size: 11px; color: var(--texte-3); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <div class="entete">
    <h1 id="titre">Infection théorique par hypothèse</h1>
    <div class="meta" id="meta">Chargement des données…</div>
  </div>
  <div class="lecture" id="lecture" aria-live="polite"></div>
  <div id="graphiques"></div>
  <div class="legende" id="legende"></div>
  <div class="note" id="note"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ======================= Configuration ======================= */
const COUCHES = {
  "16": "https://services-eu1.arcgis.com/drSF7Ohwo74Z160u/arcgis/rest/services/output_total_df_DM_ROSSI_16_pointsBSV/FeatureServer/0",
  "33": "https://services-eu1.arcgis.com/drSF7Ohwo74Z160u/arcgis/rest/services/output_total_df_DM_ROSSI_33_pointsBSV/FeatureServer/0"
};
const NOMS_ZONES = { "16": "Charentes", "33": "Nouvelle-Aquitaine" };
const CHAMP_DATE = "DATE_AGOL";
const FUSEAU = "Europe/Paris";
const COULEURS = ["#85B7EB", "#378ADD", "#185FA5", "#0C447C", "#042C53"];
const CLASSES = [ // [seuil bas, couleur de fond pâle, libellé, couleur du texte]
  [0, "rgba(34,197,94,0.13)", "Faible", "#3B6D11"],
  [1, "rgba(239,159,39,0.16)", "Moyen", "#854F0B"],
  [2, "rgba(226,75,74,0.14)", "Fort", "#A32D2D"],
  [3, "rgba(121,31,31,0.16)", "Très fort", "#501313"]
];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

const p = new URLSearchParams(location.search);
const champs = (p.get("champs") || "ZIN_H1,ZIN_H2,ZIN_H3").split(",").map(s => s.trim()).filter(Boolean);
const noms = (p.get("noms") || champs.map((c, i) => "Hypothèse " + (i + 1)).join(",")).split(",").map(s => s.trim());
const seuils = (p.get("seuils") || "1.5,4.25,8.3").split(",").map(Number).filter(v => !isNaN(v));
const stat = (p.get("stat") || "avg").toLowerCase() === "max" ? "max" : "avg";
const zone = p.get("zone") || "16";
const urlCouche = p.get("couche") || COUCHES[zone];

/* ======================= Outils ======================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/'/g, "''");
const cleJour = (() => {
  const f = new Intl.DateTimeFormat("fr-CA", { timeZone: FUSEAU, year: "numeric", month: "2-digit", day: "2-digit" });
  return ms => f.format(new Date(ms)); // AAAA-MM-JJ dans le fuseau de Paris
})();
function jourSuivant(cle) {
  const [a, m, j] = cle.split("-").map(Number);
  const d = new Date(Date.UTC(a, m - 1, j + 1));
  return d.toISOString().slice(0, 10);
}
function libelleJour(cle) { const [a, m, j] = cle.split("-").map(Number); return j + " " + MOIS[m - 1] + " " + a; }
function fmt(v) {
  if (v === null || v === undefined) return "pas de donnée";
  if (v === 0) return "0";
  if (Math.abs(v) < 0.01) return v.toLocaleString("fr-FR", { maximumSignificantDigits: 2 });
  return v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ======================= Données ======================= */
function clauseWhere() {
  const parts = [];
  if (p.get("commune")) parts.push("COMMUNE = '" + esc(p.get("commune")) + "'");
  if (p.get("point")) parts.push("NOM_PS = '" + esc(p.get("point")) + "'");
  if (p.get("where")) parts.push("(" + p.get("where") + ")");
  return parts.length ? parts.join(" AND ") : "1=1";
}

async function chargerServeur() {
  if (!urlCouche) throw new Error("Aucune couche indiquée (paramètre zone ou couche).");
  const stats = champs.map((c, i) => ({ statisticType: stat, onStatisticField: c, outStatisticFieldName: "v" + i }));
  stats.push({ statisticType: "count", onStatisticField: champs[0], outStatisticFieldName: "npts" });
  const q = new URLSearchParams({
    where: clauseWhere(),
    groupByFieldsForStatistics: CHAMP_DATE,
    outStatistics: JSON.stringify(stats),
    orderByFields: CHAMP_DATE,
    f: "json"
  });
  const r = await fetch(urlCouche.replace(/\/$/, "") + "/query?" + q.toString());
  if (!r.ok) throw new Error("Réponse du serveur : " + r.status);
  const j = await r.json();
  if (j.error) {
    const code = j.error.code;
    if (code === 499 || code === 498 || code === 403) throw new Error("La couche n'est pas accessible publiquement (" + code + "). Partagez-la avec « Tout le monde ».");
    throw new Error("Erreur ArcGIS " + code + " : " + j.error.message);
  }
  return (j.features || []).map(f => f.attributes);
}

function donneesDemo() {
  const lignes = [];
  const t0 = Date.UTC(2026, 4, 31, 22); // 01/06/2026 à 0 h, heure de Paris
  const ep = { 3: .06, 4: .19, 5: .27, 6: .04, 30: .12, 31: .02, 67: .03, 80: .03, 81: .0004, 96: .08, 97: .15, 98: .05 };
  for (let i = 0; i < 120; i++) {
    if (i >= 50 && i <= 52) continue; // jours absents
    const b = ep[i] || 0, a = { [CHAMP_DATE]: t0 + i * 86400000, npts: 28 };
    champs.forEach((c, k) => a["v" + k] = +(b * (1 + 0.2 * k)).toFixed(4));
    lignes.push(a);
  }
  return lignes;
}

function construireSerie(lignes) {
  const parJour = new Map();
  for (const a of lignes) {
    if (a[CHAMP_DATE] == null) continue;
    const cle = cleJour(a[CHAMP_DATE]);
    const vals = champs.map((c, k) => (a["v" + k] === undefined ? null : a["v" + k]));
    const n = a.npts || 0;
    if (!parJour.has(cle)) { parJour.set(cle, { vals, n }); continue; }
    // Deux horodatages pour un même jour (rare) : combinaison cohérente avec la statistique
    const e = parJour.get(cle);
    e.vals = e.vals.map((v, k) => {
      const w = vals[k];
      if (v === null) return w; if (w === null) return v;
      return stat === "max" ? Math.max(v, w) : (v * e.n + w * n) / Math.max(1, e.n + n);
    });
    e.n += n;
  }
  const cles = [...parJour.keys()].sort();
  let debut = p.get("debut") || cles[0], fin = p.get("fin") || cles[cles.length - 1];
  if (!debut || !fin) return [];
  const jours = [];
  for (let c = debut; c <= fin; c = jourSuivant(c)) {
    const e = parJour.get(c);
    const vide = !e || e.vals.every(v => v === null);
    jours.push({ cle: c, vals: vide ? champs.map(() => null) : e.vals, n: vide ? 0 : e.n });
    if (jours.length > 3000) break;
  }
  return jours;
}

/* ======================= Graphique ======================= */
let survol = -1, motif = null;
const graphiques = [];

function motifHachure(ctx) {
  if (motif) return motif;
  const c = document.createElement("canvas"); c.width = c.height = 5;
  const g = c.getContext("2d"); g.strokeStyle = "#888780"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, 5); g.lineTo(5, 0); g.stroke();
  motif = ctx.createPattern(c, "repeat"); return motif;
}

function dessiner(jours) {
  const N = jours.length;
  const toutes = jours.flatMap(j => j.vals).filter(v => v !== null);
  const vmax = toutes.length ? Math.max(...toutes) : 0;
  const ymax = vmax > 0 ? vmax * 1.15 : 1;
  const bornes = [0, ...seuils, Infinity];
  const lecture = $("lecture");
  const texteLecture = "Survolez un jour pour voir ses valeurs.";
  lecture.textContent = texteLecture;

  const plugin = {
    id: "couloir",
    beforeDatasetsDraw(ch) {
      const { ctx, chartArea: a, scales: { y } } = ch;
      ctx.save();
      for (let i = 0; i < CLASSES.length && i < bornes.length - 1; i++) {
        const lo = bornes[i], hi = bornes[i + 1];
        if (lo >= y.max) break;
        const yTop = y.getPixelForValue(Math.min(hi, y.max)), yBas = y.getPixelForValue(lo);
        ctx.fillStyle = CLASSES[i][1]; ctx.fillRect(a.left, yTop, a.right - a.left, yBas - yTop);
        ctx.fillStyle = CLASSES[i][3]; ctx.font = "11px " + getComputedStyle(document.body).fontFamily; ctx.textAlign = "right";
        ctx.fillText(CLASSES[i][2], a.right - 4, Math.max(yTop, a.top) + 11);
      }
      ctx.restore();
    },
    afterDatasetsDraw(ch) {
      const k = ch.options.plugins.couloir.k;
      const { ctx, chartArea: a, scales: { x } } = ch;
      const bw = (a.right - a.left) / N;
      ctx.save();
      for (let i = 0; i < N; i++) {
        const v = jours[i].vals[k], x0 = x.getPixelForValue(i) - bw / 2 + 0.4, w = Math.max(1, bw - 0.8), y0 = a.bottom + 3, h = 8;
        if (v === null) { ctx.fillStyle = motifHachure(ctx); ctx.fillRect(x0, y0, w, h); }
        else { ctx.fillStyle = v === 0 ? getComputedStyle(document.documentElement).getPropertyValue("--zero") : COULEURS[k % COULEURS.length]; ctx.fillRect(x0, y0, w, h); }
      }
      ctx.strokeStyle = "#b4b2a9"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.left, a.bottom); ctx.lineTo(a.right, a.bottom); ctx.stroke();
      if (survol >= 0) {
        const hx = x.getPixelForValue(survol);
        ctx.strokeStyle = "rgba(82,81,78,0.75)"; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(hx, a.top); ctx.lineTo(hx, a.bottom + 12); ctx.stroke();
      }
      ctx.restore();
    }
  };

  function surSurvol(evt, _els, ch) {
    const i = Math.round(ch.scales.x.getValueForPixel(evt.x));
    if (i < 0 || i >= N || i === survol) return;
    survol = i;
    graphiques.forEach(g => g.draw());
    const j = jours[i];
    lecture.innerHTML = "<strong>" + libelleJour(j.cle) + "</strong> — " +
      champs.map((c, k) => noms[k] + " : " + fmt(j.vals[k])).join("  ·  ");
  }

  const zoneG = $("graphiques");
  zoneG.innerHTML = "";
  champs.forEach((c, k) => {
    const serie = jours.map(j => j.vals[k]);
    const obs = serie.filter(v => v !== null);
    const nZero = obs.filter(v => v === 0).length, nVide = N - obs.length;
    const max = obs.length ? Math.max(...obs) : null;
    const dernier = k === champs.length - 1;
    const div = document.createElement("div");
    div.className = "couloir" + (dernier ? " dernier" : "");
    const cv = document.createElement("canvas");
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", noms[k] + " : " + nZero + " jours à 0 sur " + obs.length + ", maximum " + fmt(max));
    div.appendChild(cv); zoneG.appendChild(div);

    const g = new Chart(cv, {
      type: "bar",
      data: { labels: jours.map(j => j.cle), datasets: [{ data: serie, backgroundColor: COULEURS[k % COULEURS.length], barPercentage: 0.9, categoryPercentage: 1 }] },
      plugins: [plugin],
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        events: ["mousemove", "mouseout", "touchstart", "touchmove"],
        onHover: surSurvol,
        layout: { padding: { top: 6, bottom: dernier ? 0 : 14 } },
        plugins: {
          legend: { display: false }, tooltip: { enabled: false }, couloir: { k },
          title: {
            display: true, align: "start", color: "#52514e", font: { size: 12, weight: "600" }, padding: { bottom: 4 },
            text: noms[k] + "  ·  " + nZero + " jours à 0  ·  max " + fmt(max) + (nVide ? "  ·  " + nVide + " sans donnée" : "")
          }
        },
        scales: {
          x: {
            grid: { display: false }, border: { display: false },
            ticks: {
              display: dernier, padding: 14, autoSkip: false, maxRotation: 0, color: "#898781",
              callback: (v, i) => { const c = jours[i].cle; return c.endsWith("-01") ? MOIS[Number(c.slice(5, 7)) - 1] : ""; }
            }
          },
          y: { min: 0, max: ymax, border: { display: false }, grid: { color: "rgba(137,135,129,0.15)" },
               ticks: { maxTicksLimit: 3, includeBounds: false, color: "#898781", callback: v => fmt(v) } }
        }
      }
    });
    cv.addEventListener("mouseleave", () => { survol = -1; graphiques.forEach(x => x.draw()); lecture.textContent = texteLecture; });
    graphiques.push(g);
  });

  // Légende
  $("legende").innerHTML =
    '<span><span class="pastille" style="background:' + COULEURS[1] + '"></span>Infection &gt; 0</span>' +
    '<span><span class="pastille" style="background:var(--zero)"></span>0</span>' +
    '<span><span class="pastille hachure"></span>Pas de donnée</span>';
  if (vmax === 0) $("note").textContent = "Aucune infection théorique sur la période.";
}

/* ======================= Démarrage ======================= */
(async function () {
  const titreZone = p.get("titre") || (p.get("point") ? "Point " + p.get("point")
    : p.get("commune") ? p.get("commune") : (NOMS_ZONES[zone] || "Zone"));
  $("titre").textContent = "Infection théorique — " + titreZone;
  document.documentElement.style.setProperty("--h", (Number(p.get("hauteur")) || 140) + "px");
  if (p.get("fond")) document.documentElement.style.setProperty("--fond", p.get("fond"));
  try {
    const lignes = p.get("demo") ? donneesDemo() : await chargerServeur();
    const jours = construireSerie(lignes);
    if (!jours.length) {
      $("meta").textContent = "";
      $("graphiques").innerHTML = '<div class="message">Aucune donnée pour cette sélection.</div>';
      return;
    }
    const ns = jours.filter(j => j.n).map(j => j.n);
    const nMin = Math.min(...ns), nMax = Math.max(...ns);
    const d1 = jours[0].cle, d2 = jours[jours.length - 1].cle;
    const debutTxt = d1.slice(0, 4) === d2.slice(0, 4) ? libelleJour(d1).replace(/ \d{4}$/, "") : libelleJour(d1);
    $("meta").textContent = debutTxt + " → " + libelleJour(d2) + "  ·  " + jours.length + " jours  ·  " +
      (stat === "max" ? "max" : "moyenne") + " de " + (nMin === nMax ? nMin : nMin + "–" + nMax) + " point" + (nMax > 1 ? "s" : "") +
      (p.get("demo") ? "  ·  démo" : "");
    dessiner(jours);
  } catch (e) {
    console.error(e);
    $("meta").textContent = "";
    $("graphiques").innerHTML = '<div class="message erreur">Impossible de charger les données : ' + e.message + "</div>";
  }
})();
</script>
</body>
</html>
